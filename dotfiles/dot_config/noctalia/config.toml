[backdrop]
blur_intensity = 0.5
enabled = false
tint_intensity = 0.29999999999999999

[bar.default]
center = [ "date" ]
end = [
    "media",
    "tray",
    "notifications",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_ends = 0
position = "top"
radius = 0
start = [ "launcher", "workspaces" ]
thickness = 36

    [bar.default.dead_zone.actions]
    scroll_down = "workspace-switch down"
    scroll_up = "workspace-switch up"

[desktop_widgets]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@winit", "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-3"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 810.0
    cx = 464.0
    cy = 834.0
    output = "winit"
    placement_height = 1016.0
    placement_width = 928.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
clipboard_enabled = false
font_family = "Noto Sans"
settings_show_advanced = false

    [shell.panel]
    launcher_placement = "attached"
    transparency_mode = "glass"

[theme]
builtin = "Noctalia"
community_palette = "Breeze"
mode = "dark"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "niri", "umbriel" ]

[wallpaper]
directory = "/home/clemens/Pictures"

    [wallpaper.default]
    path = "/home/clemens/Pictures/wallpaper/lagrange.jpg"

    [wallpaper.last]
    path = "/home/clemens/Pictures/wallpaper/lagrange.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/clemens/Pictures/wallpaper/lagrange.jpg"

[widget.control-center]
enabled = false

[widget.date]
format = "{:%d.%m.%Y  %H:%M}"

[widget.launcher]
glyph = "noctalia"

[widget.media]
hide_when_no_media = true
show_progress = true

[widget.network]
show_label = false
vpn_status = "hidden"

[widget.volume]
mute_color = "secondary"
show_label = false

[widget.workspaces]
active_pill_size = 2.0
show_labels = false
