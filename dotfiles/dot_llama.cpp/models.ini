# mkdir -p ~/.llama.cpp/models

[*]
ctx-size      = 65536
kv-unified    = 1
parallel      = 1
spec-default  = 1

# curl -fLo ~/.llama.cpp/models/Tiel-Coder-35B-A3B-MTP-UD-IQ4_XS.gguf https://huggingface.co/peculiar-ragdoll/Tiel-Coder-35B-A3B-GGUF-MTP/resolve/main/Tiel-Coder-35B-A3B-MTP-UD-IQ4_XS.gguf?download=true
# ~18 t/s
[Tiel-Coder]
model         = /etc/llama.cpp/models/Tiel-Coder-35B-A3B-MTP-UD-IQ4_XS.gguf
ctx-size      = 131072
n-gpu-layers  = 25
cache-type-k  = q4_0
cache-type-v  = q4_0

