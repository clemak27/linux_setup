[commit]
gpgsign = "false"

[core]
autocrlf = "input"
pager = "delta"

[fetch]
prune = "true"

[init]
defaultBranch = main

[pull]
rebase = "true"

[rebase]
autoStash = "true"

[user]
email = pi@wallstreet30.cc
name = pi

[credential]
helper = cache --timeout 14400 # 4h

[hook "hk-commit-msg"]
command = test \"${HK:-1}\" = \"0\" || /var/home/linuxbrew/.linuxbrew/bin/mise x hk -- hk run commit-msg --from-hook
event = commit-msg

[hook "hk-pre-commit"]
command = test \"${HK:-1}\" = \"0\" || /var/home/linuxbrew/.linuxbrew/bin/mise x hk -- hk run pre-commit --from-hook --staged
event = pre-commit

[hook "hk-pre-push"]
command = test \"${HK:-1}\" = \"0\" || /var/home/linuxbrew/.linuxbrew/bin/mise x hk -- hk run pre-push --from-hook
event = pre-push

[hook "hk-prepare-commit-msg"]
command = test \"${HK:-1}\" = \"0\" || /var/home/linuxbrew/.linuxbrew/bin/mise x hk -- hk run prepare-commit-msg --from-hook
event = prepare-commit-msg
